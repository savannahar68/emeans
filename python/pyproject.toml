[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "emeans"
version = "0.1.1"
description = "Fast e-means clustering (k-means in a tenth of the passes), written in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/savannahar68/emeans"

[tool.maturin]
python-source = "python"
module-name = "emeans._emeans"
features = ["pyo3/extension-module"]
