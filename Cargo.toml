[package]
name = "emeans"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "e-means clustering in Rust, a port of the CPU version from faiss/contrib/e_means"
license = "MIT"
readme = "README.md"
repository = "https://github.com/savannahar68/emeans"
documentation = "https://docs.rs/emeans"
keywords = ["kmeans", "clustering", "emeans", "vector", "faiss"]
categories = ["algorithms", "science", "mathematics"]
exclude = ["/scripts", "/tests/data", "/tests/parity.rs", "/.github", "/python"]

[features]
default = ["parallel"]
# Search the nearest centroids on all cores with rayon.
parallel = ["dep:rayon"]
# Use Intel MKL (libmkl_rt) for the matrix multiply, about 10-15% faster on Intel.
# Set MKL_LIB_DIR if libmkl_rt is not on the default search path.
mkl = []
# macOS only: use Apple Accelerate for the matrix multiply. About 2x faster on Apple
# chips, but Accelerate can use several hundred MB more memory on wide vectors.
accelerate = []

[dependencies]
matrixmultiply = "0.3.10"
rayon = { version = "1.10", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
rayon = "1.10"

[workspace]
members = ["python"]
