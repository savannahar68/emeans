[package]
name = "emeans-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_emeans"
crate-type = ["cdylib"]

[features]
accelerate = ["emeans/accelerate"]

[dependencies]
emeans = { path = ".." }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
